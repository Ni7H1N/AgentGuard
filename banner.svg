<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <style>
      /* Live Animations (CSS + SMIL) - Works natively inside GitHub READMEs */
      @keyframes packetFlow {
        to { stroke-dashoffset: -28; }
      }
      @keyframes radarSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes critPulse {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #ef4444); }
        50% { opacity: 0.45; filter: drop-shadow(0 0 1px #ef4444); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanlineMove {
        0% { transform: translateY(0px); opacity: 0.0; }
        15% { opacity: 0.35; }
        85% { opacity: 0.35; }
        100% { transform: translateY(310px); opacity: 0.0; }
      }
      @keyframes badgeGlow {
        0%, 100% { stroke: #38bdf8; }
        50% { stroke: #00f2fe; }
      }

      .edge-flow-red {
        stroke-dasharray: 8 6;
        animation: packetFlow 0.95s linear infinite;
      }
      .edge-flow-amber {
        stroke-dasharray: 7 7;
        animation: packetFlow 1.3s linear infinite;
      }
      .radar-sweep {
        transform-origin: 36px 39px;
        animation: radarSpin 4s linear infinite;
      }
      .pulse-crit {
        animation: critPulse 1.8s ease-in-out infinite;
      }
      .cursor-blink {
        animation: cursorBlink 1s step-end infinite;
      }
      .hud-scanline {
        animation: scanlineMove 4.5s ease-in-out infinite;
      }
      .author-pill {
        animation: badgeGlow 3s ease-in-out infinite;
      }
    </style>

    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a0f1e" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Radar Sweep Cone Gradient -->
    <linearGradient id="radarCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- HUD Scanline Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- 1. Outer Background & Cyber Grid -->
  <rect width="1200" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
